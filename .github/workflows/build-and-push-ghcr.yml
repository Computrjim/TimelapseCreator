name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from worker.py
        id: get_version
        run: |
          VERSION=$(grep -oP 'WORKER_VERSION\s*=\s*"\K[^"]+' worker.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: computrjim
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/computrjim/timelapse-worker:latest
            ghcr.io/computrjim/timelapse-worker:${{ github.sha }}
            ghcr.io/computrjim/timelapse-worker:${{ steps.get_version.outputs.version }}
